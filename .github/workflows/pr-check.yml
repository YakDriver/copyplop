name: PR Check

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        check-latest: true
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  go-fix-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        check-latest: true
    - name: Go Fix Check
      run: make fix-check
    # TEMPORARY: The go fix bundled with the current Go release lacks some
    # analyzers available in the standalone modernize command. This step runs
    # only the ones go fix is still missing. Once `go tool fix help` lists all
    # of EXTRA_ANALYZERS, the step skips itself; remove it at that point.
    - name: modernize (analyzers missing from go fix)
      if: ${{ !cancelled() }}
      env:
        EXTRA_ANALYZERS: importcomment reflecttypeassert slicesclip
        MODERNIZE_VERSION: v0.52.0
      run: |
        available=$(go tool fix help | awk '/^Registered analyzers:/{f=1;next} /^By default/{f=0} f && NF{print $1}')
        flags=()
        for a in $EXTRA_ANALYZERS; do
          grep -qx "$a" <<<"$available" || flags+=("-$a")
        done
        if [ ${#flags[@]} -eq 0 ]; then
          echo "::notice::go fix now includes all of: $EXTRA_ANALYZERS. Remove this step from .github/workflows/pr-check.yml."
          exit 0
        fi
        modernize="golang.org/x/tools/go/analysis/passes/modernize/cmd/modernize@${MODERNIZE_VERSION}"
        echo "Running modernize ${flags[*]} on all packages..."
        go run "$modernize" "${flags[@]}" ./... || {
          echo "::error::To fix, run: go run $modernize -fix ${flags[*]} ./..."
          exit 1
        }
